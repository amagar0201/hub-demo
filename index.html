<script>
/* Appearance (Settings: Auto / Light / Dark, kept on this device): flips every prefers-color-scheme: dark block */
(function(){
  function flip(rules, v){ [].forEach.call(rules||[], function(r){
    if (r.media && r.conditionText !== undefined) {
      if (r.__m === undefined) r.__m = r.media.mediaText;
      if (/prefers-color-scheme:\s*dark/.test(r.__m)) { var t = v==='dark' ? 'all' : v==='light' ? 'not all' : r.__m; if (r.media.mediaText !== t) r.media.mediaText = t; }
      flip(r.cssRules, v);
    } }); }
  window.hubTheme = function(v){
    [].forEach.call(document.styleSheets, function(sh){ try{ flip(sh.cssRules, v); }catch(e){} });
    document.documentElement.style.colorScheme = (v==='light'||v==='dark') ? v : '';
  };
  var v=null; try{ v=localStorage.getItem('demo.theme'); }catch(e){}
  if (v && v!=='auto') window.addEventListener('load', function(){ hubTheme(v); });
})();
</script>
